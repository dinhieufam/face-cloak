[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "facecloak"
version = "0.1.0"
description = "Adversarial face cloaks against Stable Diffusion inpainting deepfakes (PGD encoder attacks + ArcFace evaluation)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "diffusers>=0.27",
    "transformers>=4.38",
    "accelerate>=0.27",
    "numpy",
    "pandas",
    "pillow",
    "matplotlib",
    "pyyaml",
    "kagglehub",
]

[project.optional-dependencies]
# Face masks + face recognition. GPU build of onnxruntime (CUDA 12) for Colab and the A5000.
eval = ["mediapipe", "opencv-python-headless", "uniface[gpu]"]
# Same with the CPU onnxruntime (laptops / Apple Silicon). Never install both: the two onnxruntime builds conflict.
eval-cpu = ["mediapipe", "opencv-python-headless", "uniface[cpu]"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
